
name: Deploy review build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout verification repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clone review branch
        run: |
          git clone --depth 1 --single-branch \
            --branch review/engine-switch-audit \
            https://github.com/paper07230723-sketch/browser-strategy-shogi-ai.git \
            source

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build application
        working-directory: source
        run: npm run build -- --base=/browser-strategy-shogi-ai-verification/

      - name: Verify engine files
        shell: bash
        run: |
          set -euo pipefail

          test -s source/dist/index.html
          test -s source/dist/coi-serviceworker.js

          for engine in sse42 tsuyouraou-mini tsuyouraou-micro; do
            test -s "source/dist/engine/$engine/yaneuraou.js"
            test -s "source/dist/engine/$engine/yaneuraou.wasm"
          done

          for engine in tsuyouraou-mini tsuyouraou-micro; do
            for file in nn.bin progress.bin eval_options.txt tag.json; do
              test -s "source/dist/engine/$engine/evaldata/$file"
            done
          done

          echo "ALL_BUILD_FILES_OK"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
